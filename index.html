<style>
:root{
  --bg:#FFF8F0; --card:#FFFFFF; --ink:#2B1B12; --mute:#8A7466; --line:#F0E2D3;
  --accent:#E8452C; --accent2:#FF8A3D; --soft:#FFEBD9; --ok:#2E9E58; --warn:#D98A1E;
  --shadow:0 2px 10px rgba(80,40,10,.08);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#17110D; --card:#241A14; --ink:#FBEFE3; --mute:#B09A8A; --line:#3A2C23; --soft:#35261C; --shadow:0 2px 10px rgba(0,0,0,.4);}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;justify-content:center}
#app{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;
  display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(14px + env(safe-area-inset-top)) 16px 24px;display:none;overflow-x:hidden}
.screen.on{display:block}
h1,h2,h3{margin:0}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.brand .mark{width:42px;height:42px;border-radius:10px;display:block;box-shadow:var(--shadow)}
.brand h1{font-size:28px;letter-spacing:-.5px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
/* tap system */
[data-a]{cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;
  transition:transform .08s ease,opacity .08s ease,background-color .12s}
[data-a].pr{transform:scale(.955);opacity:.78}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;-webkit-appearance:none;appearance:none}
input{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;-webkit-user-select:text;user-select:text}
/* search bar */
.sbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);
  border-radius:16px;padding:0 14px;height:50px;box-shadow:var(--shadow);min-width:0}
.sbar input{flex:1;min-width:0;width:100%;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.sbar .ic{font-size:18px;opacity:.7}
.fake{color:var(--mute);font-size:16px;flex:1;text-align:left}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 20px;border-radius:14px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.sm{height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.fridgecard{display:flex;align-items:center;gap:14px;margin:14px 0;padding:16px;border-radius:20px;
  background:linear-gradient(135deg,#FF8A3D,#E8452C);color:#fff;box-shadow:var(--shadow)}
.fridgecard .big{font-size:40px}
.fridgecard b{font-size:18px;display:block}
.fridgecard span{font-size:13px;opacity:.92}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}
.sec h2{font-size:19px;letter-spacing:-.2px}
.sec small{color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cat{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.cat .ce{font-size:28px;display:block;margin-bottom:2px}
.cat b{font-size:12.5px;display:block;line-height:1.2}
.cat small{color:var(--mute);font-size:11px}
/* recipe pics */
.pic{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.pic::before,.pic::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.18)}
.pic::before{width:70%;padding-bottom:70%;left:-15%;top:-25%}
.pic::after{width:55%;padding-bottom:55%;right:-12%;bottom:-22%}
.pic .e{position:relative;z-index:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));line-height:1}
.pic.t{width:76px;height:76px;border-radius:18px;flex:none}
.pic.t .e{font-size:40px}
.pic.h{width:100%;height:230px}
.pic.h .e{font-size:110px}
.pic.c{width:150px;height:110px;border-radius:18px}
.pic.c .e{font-size:58px}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px 8px;-webkit-overflow-scrolling:touch}
.hcard{flex:none;width:150px}
.hcard b{display:block;font-size:14px;margin-top:6px;line-height:1.25}
.hcard small{color:var(--mute);font-size:12px}
.row{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:10px;margin-bottom:10px;
  box-shadow:var(--shadow);border:1px solid var(--line)}
.row .info{flex:1;min-width:0}
.row b{display:block;font-size:16px;line-height:1.25}
.row small{color:var(--mute);font-size:12.5px;display:block;margin-top:3px}
.row .hint{font-size:12px;margin-top:5px;line-height:1.35}
.hint .y{color:var(--ok);font-weight:600}
.hint .n{color:var(--warn);font-weight:600}
.heart{font-size:22px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;margin:10px -16px;padding:2px 16px;-webkit-overflow-scrolling:touch}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;
  background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.have{background:var(--soft);border-color:var(--accent2)}
.chip.sug{border-style:dashed}
.empty{text-align:center;color:var(--mute);padding:36px 16px;line-height:1.5}
.empty .big{font-size:52px;display:block;margin-bottom:8px}
.gh{margin:18px 0 8px;font-size:15px;font-weight:800;color:var(--ok)}
.gh.w{color:var(--warn)}
.gh.m{color:var(--mute)}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--mute);margin:6px 0 2px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:var(--ok)}
.sw.on::after{left:21px}
/* tabbar */
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:14px;color:var(--mute);font-size:11.5px;font-weight:600}
.tab .ti{font-size:22px;filter:grayscale(1);opacity:.7}
.tab.on{color:var(--accent)}
.tab.on .ti{filter:none;opacity:1}
/* detail */
#detail{position:absolute;inset:0;background:var(--bg);z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
#detail.on{transform:translateY(0);visibility:visible}
.dtop{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 14px 0;z-index:5}
.rbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.92);color:#2B1B12;font-size:22px;
  display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.dbody{padding:18px 16px 40px;margin-top:-22px;position:relative;background:var(--bg);border-radius:24px 24px 0 0}
.dbody h1{font-size:26px;letter-spacing:-.4px;line-height:1.15}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.meta span{background:var(--soft);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.serv{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:10px 14px;margin:14px 0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper .rb{width:44px;height:44px;border-radius:12px;background:var(--soft);font-size:24px;font-weight:700;display:flex;align-items:center;justify-content:center}
.stepper .n{min-width:36px;text-align:center;font-size:20px;font-weight:800}
.ing{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.35}
.ing .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px}
.ing.done .box{background:var(--ok);border-color:var(--ok)}
.ing.done .tx{text-decoration:line-through;opacity:.5}
.ing .q{font-weight:700}
.stp{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);font-size:16px;line-height:1.5}
.stp .num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.stp.done .num{background:var(--ok)}
.stp.done .tx{opacity:.5}
.dbody h3{font-size:19px;margin:22px 0 4px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
  background:#2B1B12;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;
  transition:all .2s;z-index:99;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

/* ============================================================
   ENGINE
   ============================================================ */
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function stem(w){return w.replace(/ies$/,'y').replace(/oes$/,'o').replace(/([^s])s$/,'$1')}
function toks(s){return s.toLowerCase().replace(/[^a-z ]/g,' ').split(/\s+/).filter(Boolean).map(stem)}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1)}
function fmtTime(t){if(t<60)return t+' min';var h=Math.floor(t/60),m=t%60;return h+' hr'+(m?' '+m+' min':'')}

RECIPES.forEach(function(r){
  r.nt=toks(r.n);
  r.ing.forEach(function(i){i.tk=toks(i.n);i.pantry=PANTRY.indexOf(i.n)>-1});
});
var ALLING=(function(){
  var cnt={};RECIPES.forEach(function(r){r.ing.forEach(function(i){cnt[i.n]=(cnt[i.n]||0)+1})});
  return cnt;
})();
var ALLNAMES=Object.keys(ALLING).sort();
var COMMON=ALLNAMES.filter(function(n){return PANTRY.indexOf(n)<0}).sort(function(a,b){return ALLING[b]-ALLING[a]}).slice(0,36);

/* ---------- state ---------- */

try{
  var sv=JSON.parse(localStorage.getItem('cookbook_state')||'{}');
  if(sv.fridge)ST.fridge=sv.fridge;
  if(sv.favs)ST.favs=sv.favs;
  if(typeof sv.pantry==='boolean')ST.pantry=sv.pantry;
}catch(e){}
function save(){try{localStorage.setItem('cookbook_state',JSON.stringify({fridge:ST.fridge,favs:ST.favs,pantry:ST.pantry}))}catch(e){}}
function isFav(id){return ST.favs.indexOf(id)>-1}
function toast(msg){var t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},1600)}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(8)}catch(e){}}

/* ---------- pictures (pure CSS + emoji, no files to load) ---------- */
function pic(r,kind){
  var g=GR[r.c]||['#FFB86B','#E8452C'];
  return '<div class="pic '+kind+'" style="background:linear-gradient(135deg,'+g[0]+','+g[1]+')"><span class="e">'+r.e+'</span></div>';
}
function rowCard(r,hint){
  return '<div class="row" role="button" tabindex="0" data-a="open" data-v="'+r.id+'">'+pic(r,'t')+
   '<div class="info"><b>'+esc(r.n)+'</b><small>'+esc(r.c)+' · '+fmtTime(r.t)+' · serves '+r.s+'</small>'+(hint||'')+'</div>'+
   '<button type="button" class="heart" data-a="fav" data-v="'+r.id+'" aria-label="Save">'+(isFav(r.id)?'❤️':'🤍')+'</button></div>';
}
function hCard(r){
  return '<div class="hcard" role="button" tabindex="0" data-a="open" data-v="'+r.id+'">'+pic(r,'c')+'<b>'+esc(r.n)+'</b><small>'+fmtTime(r.t)+'</small></div>';
}

function renderSearch(){
  var h='<div class="brand"><h1>Search</h1></div>'+
   '<div class="sbar"><span class="ic">🔎</span><input id="q" type="search" placeholder="Recipe, ingredient, or type" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" value="'+esc(ST.q)+'"></div>'+
   '<div class="chips scroll" id="catchips"></div><div id="sres"></div>';
  $('s-search').innerHTML=h;
  drawCatChips();drawResults();
}
function drawCatChips(){
  var el=$('catchips');if(!el)return;
  var all=[['All','✨']].concat(CATS);
  el.innerHTML=all.map(function(c){return '<button type="button" class="chip'+(ST.cat===c[0]?' on':'')+'" data-a="cat" data-v="'+esc(c[0])+'">'+c[1]+' '+esc(c[0])+'</button>'}).join('');
}
function doSearch(q,cat){
  var ts=toks(q),out=[];
  RECIPES.forEach(function(r){
    if(cat!=='All'&&r.c!==cat)return;
    var s=0,ok=true;
    if(ts.length){
      for(var k=0;k<ts.length;k++){
        var t=ts[k],m=0;
        if(r.nt.indexOf(t)>-1)m=100;
        else if(r.n.toLowerCase().indexOf(t)>-1)m=60;
        else if(r.ing.some(function(i){return i.tk.indexOf(t)>-1}))m=30;
        else if(r.ing.some(function(i){return i.n.indexOf(t)>-1}))m=25;
        else if(r.c.toLowerCase().indexOf(t)>-1)m=20;
        else{ok=false;break}
        s+=m;
      }
    }
    if(ok)out.push({r:r,s:s});
  });
  out.sort(function(a,b){return b.s-a.s||a.r.n.localeCompare(b.r.n)});
  return out.map(function(x){return x.r});
}
function drawResults(){
  var el=$('sres');if(!el)return;
  var res=doSearch(ST.q,ST.cat);
  if(!res.length){el.innerHTML='<div class="empty"><span class="big">🤷</span>No recipes found.<br>Try a different word, or tap a type above.</div>';return}
  el.innerHTML='<p class="sub" style="margin-top:6px">'+res.length+' recipe'+(res.length>1?'s':'')+'</p>'+res.map(function(r){return rowCard(r)}).join('');
}

/* ---------- fridge ---------- */
function itemToks(){return ST.fridge.map(toks).filter(function(t){return t.length})}
function ingMatch(ing,items){
  return items.some(function(it){
    return it.every(function(t){return ing.tk.indexOf(t)>-1})||ing.tk.every(function(t){return it.indexOf(t)>-1});
  });
}
function fridgeResults(){
  var items=itemToks();if(!items.length)return null;
  var out=[];
  RECIPES.forEach(function(r){
    var need=r.ing.filter(function(i){return !(ST.pantry&&i.pantry)&&i.q!==''});
    if(!need.length)return;
    var have=[],miss=[];
    need.forEach(function(i){(ingMatch(i,items)?have:miss).push(i)});
    if(!have.length)return;
    if(miss.length>0&&have.length<2&&items.length>=3)return;
    if(miss.length>2&&have.length<2)return;
    if(miss.length>3&&have.length<3&&have.length/need.length<0.5)return;
    out.push({r:r,have:have,miss:miss,g:miss.length===0?0:(miss.length<=2?1:2)});
  });
  out.sort(function(a,b){return a.g-b.g||b.have.length-a.have.length||a.miss.length-b.miss.length||a.r.n.localeCompare(b.r.n)});
  return out;
}
function renderFridge(){
  var h='<div class="brand"><h1>My Fridge</h1></div><p class="sub">Add what you have. Separate with commas.</p>'+
   '<div style="display:flex;gap:8px"><div class="sbar" style="flex:1"><span class="ic">🥕</span><input id="fi" type="text" placeholder="eggs, milk, chicken..." autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"></div>'+
   '<button type="button" class="btn" data-a="addTyped" style="padding:0 18px">Add</button></div>'+
   '<div class="chips" id="fsug"></div>'+
   '<div class="chips" id="fchips"></div>'+
   '<div id="fctl"></div><div id="fres"></div>';
  $('s-fridge').innerHTML=h;
  drawFridgeTop();drawFridgeRes();
}
function drawSuggest(){
  var el=$('fsug');if(!el)return;
  var v=($('fi')?$('fi').value:'').trim().toLowerCase();
  var list;
  if(v){
    var last=v.split(',').pop().trim();
    list=last?ALLNAMES.filter(function(n){return n.indexOf(last)>-1&&ST.fridge.indexOf(n)<0}).slice(0,8):[];
  }else{
    list=COMMON.filter(function(n){return ST.fridge.indexOf(n)<0}).slice(0,ST.fridge.length?8:16);
  }
  el.innerHTML=(v||!list.length?'':'<div style="width:100%;color:var(--mute);font-size:13px">Tap to add:</div>')+list.map(function(n){return '<button type="button" class="chip sug" data-a="add" data-v="'+esc(n)+'">+ '+esc(n)+'</button>'}).join('');
}
function drawFridgeTop(){
  drawSuggest();
  var fc=$('fchips');
  fc.innerHTML=ST.fridge.length?ST.fridge.map(function(n,i){return '<button type="button" class="chip have" data-a="rm" data-v="'+i+'">'+esc(n)+' ✕</button>'}).join(''):'';
  $('fctl').innerHTML='<div class="toggle" role="button" tabindex="0" data-a="pantry"><span class="sw'+(ST.pantry?' on':'')+'"></span><span>Assume I have salt, pepper, water, oil &amp; ice</span></div>'+
   (ST.fridge.length?'<div style="margin-top:10px"><button type="button" class="btn ghost sm" data-a="clearFridge">Clear all</button></div>':'');
}
function drawFridgeRes(){
  var el=$('fres');if(!el)return;
  var res=fridgeResults();
  if(res===null){el.innerHTML='<div class="empty"><span class="big">🧊</span>Your fridge list is empty.<br>Add a few ingredients and matching recipes show up here.</div>';return}
  if(!res.length){el.innerHTML='<div class="empty"><span class="big">🤔</span>Nothing close yet.<br>Try adding a few more ingredients.</div>';return}
  var groups=[['Ready to cook now ✅','',res.filter(function(x){return x.miss.length===0})],
              ['Almost there (missing 1–2)','w',res.filter(function(x){return x.miss.length>0&&x.miss.length<=2})],
              ['More ideas','m',res.filter(function(x){return x.miss.length>2})]];
  var h='';
  groups.forEach(function(g){
    if(!g[2].length)return;
    h+='<div class="gh '+g[1]+'">'+g[0]+' · '+g[2].length+'</div>';
    g[2].slice(0,25).forEach(function(x){
      var hint='<div class="hint"><span class="y">Have: '+esc(x.have.map(function(i){return i.n}).join(', '))+'</span>'+
        (x.miss.length?'<br><span class="n">Need: '+esc(x.miss.map(function(i){return i.n}).join(', '))+'</span>':'')+'</div>';
      h+=rowCard(x.r,hint);
    });
  });
  el.innerHTML=h;
}
function addItems(txt){
  var parts=txt.split(',').map(function(s){return s.trim().toLowerCase()}).filter(Boolean);
  var added=0;
  parts.forEach(function(p){if(ST.fridge.indexOf(p)<0){ST.fridge.push(p);added++}});
  if(added){save();}
  return added;
}

/* ---------- saved ---------- */
function renderSaved(){
  var list=ST.favs.map(function(id){return RECIPES[id]}).filter(Boolean);
  var h='<div class="brand"><h1>Saved</h1></div><p class="sub">'+list.length+' favorite'+(list.length===1?'':'s')+'</p>';
  h+=list.length?list.map(function(r){return rowCard(r)}).join(''):'<div class="empty"><span class="big">🤍</span>Nothing saved yet.<br>Tap the heart on any recipe to keep it here.</div>';
  $('s-saved').innerHTML=h;
}

/* ---------- recipe detail ---------- */
var FR=[[0,''],[1/8,'⅛'],[1/4,'¼'],[1/3,'⅓'],[3/8,'⅜'],[1/2,'½'],[5/8,'⅝'],[2/3,'⅔'],[3/4,'¾'],[7/8,'⅞'],[1,'']];
function fmtNum(x){
  if(x>=10)return String(Math.round(x));
  var w=Math.floor(x),f=x-w,best=FR[0],d=9;
  FR.forEach(function(p){var dd=Math.abs(p[0]-f);if(dd<d){d=dd;best=p}});
  if(best[0]===1){w+=1;best=FR[0]}
  if(w===0&&best[0]===0)return '1/8';
  return (w?w:'')+(best[1]?(w?' ':'')+best[1]:'');
}
function scaleQ(q,f){
  if(!q||f===1)return q;
  var m=q.match(/^(\d+\s+\d+\/\d+|\d+\/\d+|\d+(?:\.\d+)?)(.*)$/);
  if(!m)return q;
  var n=m[1],v;
  if(n.indexOf('/')>-1){var parts=n.split(/\s+/);v=0;parts.forEach(function(p){if(p.indexOf('/')>-1){var a=p.split('/');v+=a[0]/a[1]}else v+=parseFloat(p)})}
  else v=parseFloat(n);
  return fmtNum(v*f)+m[2];
}
function renderDetail(){
  var r=RECIPES[ST.openId];if(!r)return;
  var f=ST.serv/r.s;
  var h='<div class="dtop"><button type="button" class="rbtn" data-a="back" aria-label="Back">←</button>'+
   '<button type="button" class="rbtn" data-a="fav" data-v="'+r.id+'" aria-label="Save">'+(isFav(r.id)?'❤️':'🤍')+'</button></div>'+
   pic(r,'h')+
   '<div class="dbody"><h1>'+esc(r.n)+'</h1>'+
   '<div class="meta"><span>⏱ '+fmtTime(r.t)+'</span><span>'+(CATS.filter(function(c){return c[0]===r.c})[0]||['',''])[1]+' '+esc(r.c)+'</span><span>'+r.ing.length+' ingredients</span></div>'+
   '<div class="serv"><b>Servings</b><div class="stepper"><button type="button" class="rb" data-a="servdn" aria-label="Fewer">−</button><span class="n">'+ST.serv+'</span><button type="button" class="rb" data-a="servup" aria-label="More">+</button></div></div>'+
   '<h3>Ingredients</h3><div>'+
   r.ing.map(function(i,k){
     var q=scaleQ(i.q,f);
     return '<div class="ing'+(ST.ichk[k]?' done':'')+'" role="button" tabindex="0" data-a="ichk" data-v="'+k+'"><span class="box">'+(ST.ichk[k]?'✓':'')+'</span><span class="tx">'+(q?'<span class="q">'+esc(q)+'</span> ':'')+esc(i.n)+'</span></div>';
   }).join('')+'</div>'+
   '<h3>Instructions</h3><div>'+
   r.st.map(function(s,k){
     return '<div class="stp'+(ST.schk[k]?' done':'')+'" role="button" tabindex="0" data-a="schk" data-v="'+k+'"><span class="num">'+(ST.schk[k]?'✓':(k+1))+'</span><span class="tx">'+esc(s)+'</span></div>';
   }).join('')+'</div>'+
   '<p class="sub" style="margin-top:18px;text-align:center">Tap an ingredient or step to check it off.</p></div>';
  var d=$('detail');var top=d.scrollTop;
  d.innerHTML=h;d.scrollTop=top;
}
var pushed=false;
function openRecipe(id){
  ST.openId=id;ST.serv=RECIPES[id].s;ST.ichk={};ST.schk={};
  renderDetail();
  var d=$('detail');d.scrollTop=0;
  d.classList.add('on');
  if(!pushed){try{history.pushState({cb:1},'');pushed=true}catch(e){pushed=false}}
}
function hideDetail(){
  $('detail').classList.remove('on');ST.openId=null;pushed=false;
}
function closeRecipe(){
  if(pushed){try{history.back();return}catch(e){}}
  hideDetail();
}
window.addEventListener('popstate',function(){if($('detail').classList.contains('on'))hideDetail()});

/* ---------- tabs ---------- */
function setTab(t){
  ST.tab=t;
  ['home','search','fridge','saved'].forEach(function(n){
    $('s-'+n).classList.toggle('on',n===t);
  });
  var btns=document.querySelectorAll('#tabs .tab');
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i].getAttribute('data-v')===t);
  if(t==='home')renderHome();
  if(t==='search')renderSearch();
  if(t==='fridge')renderFridge();
  if(t==='saved')renderSaved();
  var s=$('s-'+t);if(s)s.scrollTop=0;
}
function refreshCurrent(){
  if(ST.tab==='home')renderHome();
  if(ST.tab==='search'){drawResults()}
  if(ST.tab==='fridge'){drawFridgeRes()}
  if(ST.tab==='saved')renderSaved();
}

/* ---------- actions ---------- */
function act(el){
  var a=el.getAttribute('data-a'),v=el.getAttribute('data-v');
  buzz();
  switch(a){
    case 'tab':if(ST.openId!==null)hideDetail();setTab(v);break;
    case 'goSearch':ST.cat='All';setTab('search');setTimeout(function(){var q=$('q');if(q)q.focus()},60);break;
    case 'cat':ST.cat=v;ST.q=ST.tab==='search'?ST.q:'';if(ST.tab!=='search'){setTab('search')}else{drawCatChips();drawResults()}break;
    case 'open':openRecipe(+v);break;
    case 'back':closeRecipe();break;
    case 'fav':{
      var id=+v,i=ST.favs.indexOf(id);
      if(i>-1){ST.favs.splice(i,1);toast('Removed from Saved')}else{ST.favs.push(id);toast('Saved ❤️')}
      save();
      if(ST.openId!==null)renderDetail();
      refreshCurrent();
      break}
    case 'surprise':openRecipe(Math.floor(Math.random()*RECIPES.length));break;
    case 'servup':ST.serv=Math.min(ST.serv+1,48);renderDetail();break;
    case 'servdn':ST.serv=Math.max(ST.serv-1,1);renderDetail();break;
    case 'ichk':ST.ichk[v]=!ST.ichk[v];renderDetail();break;
    case 'schk':ST.schk[v]=!ST.schk[v];renderDetail();break;
    case 'add':addItems(v);var fi=$('fi');if(fi)fi.value='';drawFridgeTop();drawFridgeRes();break;
    case 'addTyped':{
      var inp=$('fi');if(!inp)break;
      if(addItems(inp.value)){inp.value=''}else if(inp.value.trim()){toast('Already added');inp.value=''}
      drawFridgeTop();drawFridgeRes();break}
    case 'rm':ST.fridge.splice(+v,1);save();drawFridgeTop();drawFridgeRes();break;
    case 'clearFridge':ST.fridge=[];save();drawFridgeTop();drawFridgeRes();break;
    case 'pantry':ST.pantry=!ST.pantry;save();drawFridgeTop();drawFridgeRes();break;
  }
}

/* ============================================================
   TAP SYSTEM
   Every [data-a] element reacts on press (pointerdown) and
   fires on release (pointerup). Works with touch, mouse, pen,
   home-screen web apps, and keyboards. Moving your finger away
   or scrolling cancels the tap, like a native button.
   ============================================================ */
var down=null,lastTap=0;
function hit(e){var t=e.target;return t&&t.closest?t.closest('[data-a]'):null}
function clearPress(){if(down){down.t.classList.remove('pr');down=null}}
var app=document.getElementById('app');
if(window.PointerEvent){
  app.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    var t=hit(e);if(!t)return;
    clearPress();
    down={t:t,x:e.clientX,y:e.clientY};
    t.classList.add('pr');
  },{passive:true});
  app.addEventListener('pointerup',function(e){
    if(!down)return;
    var d=down;clearPress();
    var t=hit(e);
    if(t===d.t&&Math.abs(e.clientX-d.x)<14&&Math.abs(e.clientY-d.y)<14){lastTap=Date.now();act(d.t)}
  },{passive:true});
  app.addEventListener('pointercancel',clearPress,{passive:true});
  app.addEventListener('pointerleave',clearPress,{passive:true});
  window.addEventListener('blur',clearPress);
  document.addEventListener('visibilitychange',clearPress);
  document.addEventListener('scroll',clearPress,{capture:true,passive:true});
}else{
  /* very old browsers: touch events for press feedback, click for action */
  app.addEventListener('touchstart',function(e){var t=hit(e);if(t){down={t:t};t.classList.add('pr')}},{passive:true});
  app.addEventListener('touchend',clearPress,{passive:true});
  app.addEventListener('touchcancel',clearPress,{passive:true});
}
/* click handles keyboards, assistive tech, and old browsers; skipped right after a tap so nothing fires twice */
app.addEventListener('click',function(e){
  var t=hit(e);if(!t)return;
  if(Date.now()-lastTap<650)return;
  act(t);
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){
    var t=hit(e);
    if(t&&t.tagName!=='BUTTON'){e.preventDefault();act(t)}
  }
});

/* typing */
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ST.q=e.target.value;drawResults()}
  if(e.target.id==='fi'){drawSuggest()}
});
app.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.id==='fi'){
    e.preventDefault();
    var inp=e.target;
    if(addItems(inp.value))inp.value='';else inp.value='';
    drawFridgeTop();drawFridgeRes();
  }
  if(e.key==='Enter'&&e.target.id==='q'){e.target.blur()}
});

/* prevent pinch-zoom and double-tap zoom jitter on iOS home-screen mode */
document.addEventListener('gesturestart',function(e){e.preventDefault()});

setTab('home');
</script>
